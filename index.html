<body>
  <div class="container">
    <header>
      <h1>广期所仓单日报</h1>
      <p class="author">制作人：<strong>vaor</strong></p>
      <div class="meta" id="meta">
        <div class="date-badge date-picker-wrap" id="date-picker">
          <span>数据日期：</span>
          <select id="date-year" class="date-select year" title="年" aria-label="年"></select>
          <span class="date-unit">年</span>
          <select id="date-month" class="date-select month" title="月" aria-label="月"></select>
          <span class="date-unit">月</span>
          <select id="date-day" class="date-select day" title="日" aria-label="日"></select>
          <span class="date-unit">日</span>
        </div>
        <span id="update-time">—</span>
      </div>
      <div class="actions">
        <button class="theme-btn" id="theme-btn" onclick="toggleTheme()" title="切换主题">☀️ 浅色主题</button>
        <button class="refresh-btn" id="refresh-btn" onclick="refreshData()">
          <span class="icon">↻</span> 刷新数据
        </button>
      </div>
    </header>

    <div id="msg" class="msg"></div>
    <div id="loading" class="loading">正在加载仓单数据…</div>

    <div id="content" style="display:none;">
      <div class="cards" id="cards"></div>

      <h2 class="section-title">仓单数量历史变化<span class="hint">多年同期对比</span></h2>
      <div id="charts"></div>

      <h2 class="section-title">多晶硅分商标仓单<span class="hint">按商标汇总 · 点击日期可切换当日结构</span></h2>
      <div id="tm-charts"></div>

      <h2 class="section-title">分仓库明细<span class="hint" id="wh-hint">点击仓库行查看季节性图 · 库容为交易所公布的最低保障库容/厂库标准仓单最大量</span></h2>
      <div class="tabs" id="tabs"></div>
      <div id="geo-charts"></div>
      <div id="detail-panels"></div>
    </div>


    <div class="modal-backdrop" id="wh-modal" role="dialog" aria-modal="true">
      <div class="modal">
        <div class="modal-header">
          <div>
            <h3 id="wh-modal-title">仓库季节性图</h3>
            <p class="sub" id="wh-modal-sub"></p>
          </div>
          <button type="button" class="modal-close" id="wh-modal-close" aria-label="关闭">×</button>
        </div>
        <div class="modal-body">
          <div class="modal-chart-wrap"><canvas id="wh-modal-chart"></canvas></div>
          <div class="modal-empty" id="wh-modal-empty" style="display:none;">该仓库暂无足够历史数据绘制季节图</div>
        </div>
      </div>
    </div>

    <footer>
      <p>数据来源：<a href="http://www.gfex.com.cn/gfex/cdrb/hqsj_tjsj.shtml" target="_blank" rel="noopener">广州期货交易所 · 仓单日报</a></p>
      <p style="margin-top:0.4rem;">制作人：vaor · 本站仅作数据展示，不构成任何投资建议。</p>
    </footer>
  </div>

        d: dateStr.slice(8, 10),
      };
    }

    function fillSelect(sel, values, selected, valueFn, labelFn) {
      if (!sel) return;
      const vfn = valueFn || (v => v);
      const lfn = labelFn || (v => v);
      const prev = selected;
      sel.innerHTML = values.map(v => {
        const val = vfn(v);
        const lab = lfn(v);
        return `<option value="${val}">${lab}</option>`;
      }).join("");
      if (prev && values.some(v => vfn(v) === prev)) sel.value = prev;
      else if (values.length) sel.value = vfn(values[0]);
    }

    function rebuildDatePicker(selectedDate, dates) {
      const ySel = document.getElementById("date-year");
      const mSel = document.getElementById("date-month");
      const dSel = document.getElementById("date-day");
      if (!ySel || !mSel || !dSel) return;

      const all = (dates && dates.length) ? dates : getAvailableDates(window.__lastData || EMBEDDED_DATA);
      if (!all.length) return;

      const cur = parseYMD(selectedDate) || parseYMD(all[0]);
      const years = [...new Set(all.map(d => d.slice(0, 4)))].sort().reverse();
      fillSelect(ySel, years, cur.y);

      const year = ySel.value;
      const months = [...new Set(
        all.filter(d => d.startsWith(year)).map(d => d.slice(5, 7))
      )].sort().reverse();
      fillSelect(mSel, months, cur.m, v => v, v => String(Number(v)));

      const ym = year + "-" + mSel.value;
      const days = [...new Set(
        all.filter(d => d.startsWith(ym)).map(d => d.slice(8, 10))
      )].sort().reverse();
      // 优先选中原日；若该月无此日，选该月最近有数据的一天
      let wantDay = cur.d;
      if (!days.includes(wantDay)) {
        wantDay = days[0];
      }
      fillSelect(dSel, days, wantDay, v => v, v => String(Number(v)));

      ySel.dataset.bound = "1";
    }

    function currentPickedDate() {
      const y = document.getElementById("date-year")?.value;
      const m = document.getElementById("date-month")?.value;
      const d = document.getElementById("date-day")?.value;
      if (!y || !m || !d) return null;
      return y + "-" + m + "-" + d;
    }

    function onDateLevelChange(level) {
      const dates = getAvailableDates(window.__lastData || EMBEDDED_DATA);
      const y = document.getElementById("date-year").value;
      const m = document.getElementById("date-month").value;
      const d = document.getElementById("date-day").value;
      let target = y + "-" + m + "-" + d;

      if (level === "year" || level === "month") {
        // 年月变更后重填下级，尽量保留日
        rebuildDatePicker(target, dates);
        target = currentPickedDate();
      }

      if (!target) return;
      if (!dates.includes(target)) {
        // 兜底：同月最近交易日
        const prefix = target.slice(0, 8);
        const cand = dates.filter(x => x.startsWith(prefix.slice(0, 7)));
        target = cand[0] || dates[0];
        rebuildDatePicker(target, dates);
      }
      if (window.__lastData && window.__lastData.data_date === target) return;
      selectDate(target);
    }

    function bindDatePickerOnce() {
      const ySel = document.getElementById("date-year");
      const mSel = document.getElementById("date-month");
      const dSel = document.getElementById("date-day");
      if (!ySel || ySel.dataset.listeners === "1") return;
      ySel.dataset.listeners = "1";
      ySel.addEventListener("change", () => onDateLevelChange("year"));
      mSel.addEventListener("change", () => onDateLevelChange("month"));
      dSel.addEventListener("change", () => onDateLevelChange("day"));
    }

    function resolveProvince(warehouse) {
      const name = String(warehouse || "");
      if (WAREHOUSE_PROVINCE_EXPLICIT[name]) return WAREHOUSE_PROVINCE_EXPLICIT[name];
      // 括号内地名优先
      const m = name.match(/[（(]([^）)]+)[）)]/);
      if (m) {
        const inner = m[1];
        for (const [re, prov] of PROVINCE_KEYWORDS) {
          if (re.test(inner)) return prov;
        }
        if (WAREHOUSE_PROVINCE_EXPLICIT[inner]) return WAREHOUSE_PROVINCE_EXPLICIT[inner];
      }
      for (const [re, prov] of PROVINCE_KEYWORDS) {
        if (re.test(name)) return prov;
      }
      return "未知";
    }

        const prov = resolveProvince(r.warehouse);
        const region = resolveRegion(prov);
        byProv[prov] = (byProv[prov] || 0) + qty;
        byRegion[region] = (byRegion[region] || 0) + qty;
      });
      return { byProv, byRegion };
    }

    function destroyGeoCharts() {
      ["geo-prov", "geo-region", "geo-prov-line", "geo-region-line"].forEach(k => {
        if (chartInstances[k]) {
          try { chartInstances[k].destroy(); } catch (e) {}
          delete chartInstances[k];
        }
      });
    }

    function makeGeoLineChart(canvasId, dates, seriesNames, seriesMap, colorFn) {
      const tick = getComputedStyle(document.documentElement).getPropertyValue("--chart-tick").trim() || "#8b9cb3";
      const legend = getComputedStyle(document.documentElement).getPropertyValue("--chart-legend").trim() || "#c8d4e6";
      const grid = getComputedStyle(document.documentElement).getPropertyValue("--chart-grid").trim() || "rgba(255,255,255,0.06)";
      const datasets = seriesNames.map((name, i) => ({
        label: name,
        data: dates.map(d => {
          const v = seriesMap[name] && seriesMap[name][d];
          return v != null ? v : null;
        }),
        borderColor: colorFn(name, i),
        backgroundColor: colorFn(name, i) + "22",
        tension: 0.25,
        pointRadius: 0,
        pointHoverRadius: 4,
        borderWidth: 2,
        spanGaps: true,
        fill: false,
      }));
      return new Chart(document.getElementById(canvasId).getContext("2d"), {
        type: "line",
        data: { labels: dates, datasets },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          interaction: { mode: "index", intersect: false },
          plugins: {
            legend: { labels: { color: legend, usePointStyle: true, pointStyle: "circle", boxWidth: 8 } },
            tooltip: {
              callbacks: {
                label: (item) => {
                  if (item.parsed.y == null) return null;
                  return item.dataset.label + ": " + Number(item.parsed.y).toLocaleString("zh-CN") + " 手";
                }
              }
            }
          },
          scales: {
            x: {
              ticks: { color: tick, maxRotation: 45, autoSkip: true, maxTicksLimit: 12 },
              grid: { color: grid }
            },
            y: {
              ticks: { color: tick, callback: (v) => Number(v).toLocaleString("zh-CN") },
              grid: { color: grid },
              title: { display: true, text: "仓单量（手）", color: tick }
            }
          }
        }
      });
    }

    function buildGeoHistoryMaps(code) {
      const dates = Object.keys(ALL_DAYS || {}).sort();
      const provSeries = {};
      const regionSeries = {};
      dates.forEach(date => {
        const snap = ALL_DAYS[date];
        const rows = (snap.details && snap.details[code]) || [];
        const { byProv, byRegion } = aggregateByGeo(rows);
        Object.entries(byProv).forEach(([p, v]) => {
          if (!provSeries[p]) provSeries[p] = {};
          provSeries[p][date] = v;
        });
        Object.entries(byRegion).forEach(([r, v]) => {
          if (!regionSeries[r]) regionSeries[r] = {};
          regionSeries[r][date] = v;
        });
      });
      return { dates, provSeries, regionSeries };
    }


    function makeHBarChart(canvasId, labels, values, colors, xTitle) {
      const tick = getComputedStyle(document.documentElement).getPropertyValue("--chart-tick").trim() || "#8b9cb3";
      const grid = getComputedStyle(document.documentElement).getPropertyValue("--chart-grid").trim() || "rgba(255,255,255,0.06)";
      const total = values.reduce((s, v) => s + v, 0) || 1;
      return new Chart(document.getElementById(canvasId).getContext("2d"), {
        type: "bar",
        data: {
          labels,
          datasets: [{
            label: "仓单量",
            data: values,
            backgroundColor: colors.map(c => c + "cc"),
            borderColor: colors,
            borderWidth: 1,
            borderRadius: 6
          }]
        },
        options: {
          indexAxis: "y",
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false },
            tooltip: {
              callbacks: {
                label: (item) => {
                  const v = item.parsed.x;
                  return v.toLocaleString("zh-CN") + " 手（" + ((v / total) * 100).toFixed(1) + "%）";
                }
              }
            }
          },
          scales: {
            x: {
              ticks: { color: tick, callback: (v) => Number(v).toLocaleString("zh-CN") },
              grid: { color: grid },
              title: { display: true, text: xTitle || "仓单量（手）", color: tick }
            },
            y: { ticks: { color: tick }, grid: { display: false } }
          }
        }
      });
    }

    function buildGeoCharts(data, code) {
      const container = document.getElementById("geo-charts");
      if (!container) return;
      destroyGeoCharts();
      container.innerHTML = "";
      const active = code || (VARIETY_ORDER.find(c => data.summary && data.summary[c]) || "lc");
      const meta = VARIETY_META[active] || { name: active, color: "#60a5fa" };
      const list = (data.details && data.details[active]) || [];
      const { byProv, byRegion } = aggregateByGeo(list);

      const provRanked = Object.entries(byProv).sort((a, b) => b[1] - a[1]);
      const regionRanked = REGION_ORDER
        .filter(r => byRegion[r])
        .map(r => [r, byRegion[r]])
        .concat(Object.entries(byRegion).filter(([r]) => !REGION_ORDER.includes(r)).sort((a, b) => b[1] - a[1]));

      const provColors = ["#60a5fa","#34d399","#fbbf24","#f472b6","#a78bfa","#fb7185","#38bdf8","#c084fc","#4ade80","#f97316"];
      const regionColors = {
        "华东": "#60a5fa", "华北": "#fbbf24", "华南": "#34d399", "华中": "#f472b6",
        "西北": "#a78bfa", "西南": "#fb7185", "东北": "#38bdf8", "其他": "#94a3b8"
      };

      const provCard = document.createElement("div");
      provCard.className = "chart-card " + (meta.class || "");
      provCard.innerHTML = `
        <div class="chart-header">
          <div class="chart-title">分省份仓单<span>${meta.name} · ${data.data_date || ""}</span></div>
        </div>
        <div class="chart-wrap" style="height:${Math.max(220, provRanked.length * 32 + 48)}px">
          <canvas id="chart-geo-prov"></canvas>
        </div>
      `;
      const regionCard = document.createElement("div");
      regionCard.className = "chart-card " + (meta.class || "");
      regionCard.innerHTML = `
        <div class="chart-header">
          <div class="chart-title">分区域仓单<span>华东 / 华北 / 华南 / 华中 / 西北 / 西南 / 东北</span></div>
        </div>
        <div class="chart-wrap" style="height:${Math.max(220, regionRanked.length * 36 + 48)}px">
          <canvas id="chart-geo-region"></canvas>
        </div>
      `;
      container.appendChild(provCard);
      container.appendChild(regionCard);

      if (!provRanked.length) {
        provCard.querySelector(".chart-wrap").innerHTML = '<div class="modal-empty">暂无仓库数据</div>';
        regionCard.querySelector(".chart-wrap").innerHTML = '<div class="modal-empty">暂无仓库数据</div>';
        return;
      }

      chartInstances["geo-prov"] = makeHBarChart(
        "chart-geo-prov",
        provRanked.map(x => x[0]),
        provRanked.map(x => x[1]),
        provRanked.map((_, i) => provColors[i % provColors.length])
      );
      chartInstances["geo-region"] = makeHBarChart(
        "chart-geo-region",
        regionRanked.map(x => x[0]),
        regionRanked.map(x => x[1]),
        regionRanked.map(x => regionColors[x[0]] || "#94a3b8")
      );

      // 历史折线：按省份 / 区域汇总的仓单量随交易日变化
      const hasHistory = ALL_DAYS && Object.keys(ALL_DAYS).length > 5;
      if (hasHistory) {
        const { dates, provSeries, regionSeries } = buildGeoHistoryMaps(active);
        const provNames = provRanked.map(x => x[0]);
        const regionNames = regionRanked.map(x => x[0]);

        const provLineCard = document.createElement("div");
        provLineCard.className = "chart-card " + (meta.class || "");
        provLineCard.innerHTML = `
          <div class="chart-header">
            <div class="chart-title">分省份仓单历史<span>${meta.name} · 各省合计随交易日</span></div>
          </div>
          <div class="chart-wrap line-wrap"><canvas id="chart-geo-prov-line"></canvas></div>
        `;
        const regionLineCard = document.createElement("div");
        regionLineCard.className = "chart-card " + (meta.class || "");
        regionLineCard.innerHTML = `
          <div class="chart-header">
            <div class="chart-title">分区域仓单历史<span>七大区合计随交易日</span></div>
          </div>
          <div class="chart-wrap line-wrap"><canvas id="chart-geo-region-line"></canvas></div>
        `;
        container.appendChild(provLineCard);
        container.appendChild(regionLineCard);

        chartInstances["geo-prov-line"] = makeGeoLineChart(
          "chart-geo-prov-line",
          dates,
          provNames,
          provSeries,
          (name, i) => provColors[i % provColors.length]
        );
        chartInstances["geo-region-line"] = makeGeoLineChart(
          "chart-geo-region-line",
          dates,
          regionNames,
          regionSeries,
          (name, i) => regionColors[name] || provColors[i % provColors.length]
        );
      } else {
        const tip = document.createElement("div");
        tip.className = "chart-card";
        tip.style.gridColumn = "1 / -1";
        tip.innerHTML = '<div style="padding:1rem;text-align:center;color:var(--text-muted);font-size:0.9rem;">部署到网站或本地服务器打开后，将加载历史日数据并显示省份/区域仓单历史折线图。</div>';
        container.appendChild(tip);
      }
    }

      const list = (data.details && data.details.ps) || [];
      const byTm = {};
      list.forEach(r => {
        const tm = (r.trademark && String(r.trademark).trim()) ? String(r.trademark).trim() : "（无商标）";

                grid: { display: false }
              }
            }
          }
        });

      // 历史走势：各商标合计随时间变化（需 ALL_DAYS）

            }

    function buildVarietyCharts(history) {
      const container = document.getElementById("charts");
      container.innerHTML = "";
      destroyCharts();
      if (!history || !history.length) {
        container.innerHTML = '<div class="chart-card" style="text-align:center;color:var(--text-muted);padding:2rem;">暂无历史数据</div>';
        return;
      }
      const sorted = history.slice().sort((a, b) => a.date.localeCompare(b.date));
      const years = [...new Set(sorted.map(h => h.date.slice(0, 4)))].sort();
      const mdSet = new Set();
      sorted.forEach(h => mdSet.add(h.date.slice(5)));
      const mdLabels = [...mdSet].sort();
      const tick = getComputedStyle(document.documentElement).getPropertyValue("--chart-tick").trim() || "#8b9cb3";
      const legend = getComputedStyle(document.documentElement).getPropertyValue("--chart-legend").trim() || "#c8d4e6";
      const grid = getComputedStyle(document.documentElement).getPropertyValue("--chart-grid").trim() || "rgba(255,255,255,0.06)";

      VARIETY_ORDER.forEach(code => {
        const meta = VARIETY_META[code];
        const card = document.createElement("div");
        card.className = "chart-card " + meta.class;
        const yearRange = years.length ? (years[0] + (years.length > 1 ? "–" + years[years.length - 1] : "")) : "";
        card.innerHTML = `
          <div class="chart-header">
            <div class="chart-title">${meta.name}<span>多年同期对比 · ${yearRange}</span></div>
          </div>
          <div class="chart-wrap"><canvas id="chart-${code}"></canvas></div>
        `;
        container.appendChild(card);

        const yearMaps = {};
        years.forEach(y => {
          yearMaps[y] = {};
          sorted.filter(h => h.date.startsWith(y)).forEach(h => {
            yearMaps[y][h.date.slice(5)] = h[code] || 0;
          });
        });
        const datasets = years.map((y, yi) => ({
          label: y + "年",
          data: mdLabels.map(md => (yearMaps[y][md] != null ? yearMaps[y][md] : null)),
          borderColor: YEAR_COLORS[yi % YEAR_COLORS.length],
          backgroundColor: YEAR_COLORS[yi % YEAR_COLORS.length] + "22",
          tension: 0.3,
          pointRadius: 2,
          pointHoverRadius: 5,
          borderWidth: 2,
          spanGaps: true,
          fill: false,
        }));

        const ctx = document.getElementById("chart-" + code).getContext("2d");
        chartInstances[code] = new Chart(ctx, {
          type: "line",
          data: { labels: mdLabels, datasets },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            interaction: { mode: "index", intersect: false },
            plugins: {
              legend: { labels: { color: legend, usePointStyle: true, pointStyle: "circle" } },
              tooltip: {
                callbacks: {
                  title: (items) => "同期 " + items[0].label,
                  label: (item) => {
                    if (item.parsed.y == null) return null;
                    return item.dataset.label + ": " + Number(item.parsed.y).toLocaleString("zh-CN") + " 手";
                  }
                }
              }
            },
            scales: {
              x: {
                title: { display: true, text: "月-日（多年对齐）", color: tick },
                ticks: { color: tick, maxRotation: 45, autoSkip: true, maxTicksLimit: 16 },
                grid: { color: grid }
              },
              y: {
                ticks: { color: tick, callback: (v) => Number(v).toLocaleString("zh-CN") },
                grid: { color: grid },
                title: { display: true, text: "仓单量（手）", color: tick }
              }
            }
          }
        });
      });
    }

    function render(data) {
      window.__lastData = data;
      document.getElementById("loading").style.display = "none";
      document.getElementById("content").style.display = "block";
      bindDatePickerOnce();
      if (data.data_date) {
        rebuildDatePicker(data.data_date, getAvailableDates(data));
      }
      document.getElementById("update-time").textContent = "更新于 " + data.update_time;

      const whHint = [];
      if (data.week_base_date) whHint.push("周对比基准 " + data.week_base_date);
      if (data.month_base_date) whHint.push("月对比基准 " + data.month_base_date);
      document.getElementById("wh-hint").textContent = whHint.length ? "（" + whHint.join(" · ") + "）" : "";

      const cardsEl = document.getElementById("cards");
      cardsEl.innerHTML = VARIETY_ORDER.map(code => {
        const s = data.summary[code];
        if (!s) return "";
        const meta = VARIETY_META[code];
        const dayD = s.diff != null ? s.diff : 0;
        const weekD = s.weekDiff != null ? s.weekDiff : 0;
        const monthD = s.monthDiff != null ? s.monthDiff : 0;
        return `
          <div class="card ${meta.class}">
            <div class="card-header">
              <div class="card-title">${s.variety}</div>
              <div class="card-code">${s.code}</div>
            </div>
            <div class="net-grid">
              <div class="net-item">
                <div class="label">日度净变化</div>
                <div class="value ${diffClass(dayD)}">${fmtDiff(dayD)}</div>
              </div>
              <div class="net-item">
                <div class="label">周度累计</div>
                <div class="value ${diffClass(weekD)}">${fmtDiff(weekD)}</div>
              </div>
              <div class="net-item">
                <div class="label">月度累计</div>
                <div class="value ${diffClass(monthD)}">${fmtDiff(monthD)}</div>
              </div>
            </div>
            <div class="stats">
              <div class="stat reg">
                <div class="label">注册量（日）</div>
                <div class="num">${fmt(s.regWbillQty)}</div>
              </div>
              <div class="stat logout">
                <div class="label">注销量（日）</div>
                <div class="num">${fmt(s.logoutWbillQty)}</div>
              </div>
              <div class="stat">
                <div class="label">今日仓单</div>
                <div class="num">${fmt(s.wbillQty)}</div>
              </div>
              <div class="stat">
                <div class="label">昨日仓单</div>
                <div class="num">${fmt(s.lastWbillQty)}</div>
              </div>
            </div>
          </div>
        `;
      }).join("");

      buildVarietyCharts(Array.isArray(data.history) ? data.history : []);
      buildTrademarkCharts(data);

      const tabsEl = document.getElementById("tabs");
      const panelsEl = document.getElementById("detail-panels");
      tabsEl.innerHTML = "";
      panelsEl.innerHTML = "";

      VARIETY_ORDER.forEach((code, idx) => {
        const s = data.summary[code];
        const list = (data.details && data.details[code]) || [];
        if (!s) return;

        const tab = document.createElement("button");
        tab.className = "tab" + (idx === 0 ? " active" : "");
        tab.textContent = s.variety;
        tab.onclick = () => {
          document.querySelectorAll("#tabs .tab").forEach(t => t.classList.remove("active"));
          document.querySelectorAll(".detail-panel").forEach(p => p.classList.remove("active"));
          tab.classList.add("active");
          document.getElementById("panel-" + code).classList.add("active");
          buildGeoCharts(window.__lastData || data, code);
        };
        tabsEl.appendChild(tab);

        const panel = document.createElement("div");
        panel.className = "detail-panel" + (idx === 0 ? " active" : "");
        panel.id = "panel-" + code;

        if (!list.length) {
          panel.innerHTML = `<div class="table-wrap" style="padding:1.5rem;text-align:center;color:var(--text-muted);">暂无仓库明细</div>`;
        } else {
          const rows = list.map((w, wi) => {
            const capOcc = capCellHtml(code, w.warehouse, list);
            return `
            <tr class="wh-row" data-code="${code}" data-wh="${String(w.warehouse).replace(/"/g, "&quot;")}" data-tm="${String(w.trademark || "").replace(/"/g, "&quot;")}" title="点击查看季节性图">
              <td>${w.warehouse}</td>
              <td>${w.trademark || "—"}</td>
              <td>${fmt(w.last)}</td>
              <td class="pos">${fmt(w.reg)}</td>
              <td class="neg">${fmt(w.logout)}</td>
              <td>${fmt(w.today)}</td>
              <td class="${posNegClass(w.diff)}">${fmtDiff(w.diff)}</td>
              <td class="${posNegClass(w.weekDiff)}">${fmtDiff(w.weekDiff)}</td>
              <td class="${posNegClass(w.monthDiff)}">${fmtDiff(w.monthDiff)}</td>
              <td>${capOcc.cap}</td>
              <td>${capOcc.occ}</td>
            </tr>`;
          }).join("");
          panel.innerHTML = `
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>仓库 / 厂库</th>
                    <th>商标名称</th>
                    <th>昨日仓单</th>
                    <th>注册量</th>
                    <th>注销量</th>
                    <th>今日仓单</th>
                    <th>日变化</th>
                    <th>周变化</th>
                    <th>月变化</th>
                    <th>最大库容</th>
                    <th>占用比例</th>
                  </tr>
                </thead>
                <tbody>${rows}</tbody>
              </table>
            </div>
            <p class="cap-note">占用比例按该仓库全部商标仓单合计（吨）÷ 核定库容计算。碳酸锂 1 吨/手，多晶硅 3 吨/手，工业硅 5 吨/手。未公布库容的仓库显示为 —。</p>
          `;
        }
        panelsEl.appendChild(panel);
      });

      const firstCode = VARIETY_ORDER.find(c => data.summary && data.summary[c]) || "lc";
      buildGeoCharts(data, firstCode);
    }



    async function ensureDaysLoaded() {
      if (DAYS_LOADED && Object.keys(ALL_DAYS).length) return true;
      if (location.protocol === "file:") {
        return Object.keys(ALL_DAYS).length > 0;
      }
      try {
        const files = (EMBEDDED_DATA.day_files && EMBEDDED_DATA.day_files.length)
          ? EMBEDDED_DATA.day_files
          : ["days-2024.json", "days-2025.json", "days-2026.json"];
        const results = await Promise.all(
          files.map(f => fetch(f + "?t=" + Date.now(), { cache: "no-store" })
            .then(r => r.ok ? r.json() : {})
            .catch(() => ({})))
        );
        ALL_DAYS = Object.assign({}, ...results);
        DAYS_LOADED = true;
        return Object.keys(ALL_DAYS).length > 0;
      } catch (e) {
        console.warn("day files load failed", e);
        return false;
      }
    }


    async function selectDate(dateStr) {
      hideMsg();
      await ensureDaysLoaded();
      if (!ALL_DAYS[dateStr]) {
        if (location.protocol === "file:") {
          showMsg("本地双击仅含最新日。请用本地服务器打开本文件夹，或部署到 GitHub Pages 后切换历史日期。", "info");
        } else {
          showMsg("未找到 " + dateStr + " 的缓存数据。", "error");
        }
        return;
      }
      const day = JSON.parse(JSON.stringify(ALL_DAYS[dateStr]));
      day.history = (window.__lastData && window.__lastData.history) || EMBEDDED_DATA.history || [];
      day.available_dates = (window.__lastData && window.__lastData.available_dates) || EMBEDDED_DATA.available_dates || Object.keys(ALL_DAYS).sort().reverse();
      render(day);
      showMsg("已切换到 " + dateStr + " 仓单数据", "success");
      setTimeout(hideMsg, 2500);
    }

    async function refreshData() {
      const btn = document.getElementById("refresh-btn");
      btn.disabled = true;
      btn.classList.add("spinning");
      hideMsg();
      if (location.protocol === "file:") {
        showMsg("当前是本地双击打开，无法在线刷新。请用本地服务器打开，或部署到 GitHub Pages 后刷新。", "info");
        btn.disabled = false;
        btn.classList.remove("spinning");
        return;
      }
      try {
        const res = await fetch("data.json?t=" + Date.now(), { cache: "no-store" });
        if (!res.ok) throw new Error("HTTP " + res.status);
        const data = await res.json();
        if (!data.summary) throw new Error("数据格式异常");
        if (data.data_date) {
          ALL_DAYS[data.data_date] = data;
          if (Array.isArray(data.available_dates)) {
            /* keep */
          } else {
            data.available_dates = Object.keys(ALL_DAYS).sort().reverse();
          }
                  }
        render(data);
        showMsg("已刷新到最新数据（" + data.data_date + "）", "success");
        setTimeout(hideMsg, 3000);
      } catch (e) {
        showMsg("刷新失败：" + e.message + "。已保留当前显示数据。", "error");
      } finally {
        btn.disabled = false;
        btn.classList.remove("spinning");
      }
    }

    try {
      
    // 仓库行点击 → 季节性图
    document.getElementById("detail-panels").addEventListener("click", (e) => {
      const tr = e.target.closest("tr.wh-row");
      if (!tr) return;
      const code = tr.getAttribute("data-code");
      const wh = tr.getAttribute("data-wh") || "";
      const tm = tr.getAttribute("data-tm") || "";
      openWarehouseModal(code, wh, tm);
    });
    document.getElementById("wh-modal-close").addEventListener("click", closeWarehouseModal);
    document.getElementById("wh-modal").addEventListener("click", (e) => {
      if (e.target.id === "wh-modal") closeWarehouseModal();
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") closeWarehouseModal();
    });

      render(EMBEDDED_DATA);
      if (location.protocol === "file:") {
        showMsg("本地嵌入数据版本，双击即可查看。部署到网站后可切换约两年历史交易日。", "info");
      } else {
        ensureDaysLoaded().then(ok => {
          if (ok) {
            const n = Object.keys(ALL_DAYS).length;
            const dates = EMBEDDED_DATA.available_dates || Object.keys(ALL_DAYS).sort().reverse();
                        if (window.__lastData) {
              window.__lastData.available_dates = dates;
              render(window.__lastData);
            }
          }
        });
      }
    } catch (e) {
      document.getElementById("loading").style.display = "none";
      showMsg("数据加载失败：" + e.message, "error");
    }
  </script>
</body>
