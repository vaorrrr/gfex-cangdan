    :root {

      --text-muted: #8b9cb3;

      line-height: 1.6;
      background-image:

    .container { max-width: 1100px; margin: 0 auto; padding: 2rem 1.25rem 4rem; }
    header { text-align: center; margin-bottom: 2rem; }
    header h1 { font-size: 1.75rem; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 0.5rem; }
    header .subtitle { color: var(--text-muted); font-size: 0.95rem; }
    .meta {

      margin-top: 1.25rem; font-size: 0.875rem; color: var(--text-muted);

    .meta span {

    .meta .date-badge { color: var(--accent); border-color: rgba(59, 130, 246, 0.4); }

    .tab {

    .loading { text-align: center; padding: 4rem 1rem; color: var(--text-muted); }
    .msg {
      padding: 0.75rem 1rem; border-radius: 10px; margin-bottom: 1.25rem;
      font-size: 0.85rem; text-align: center; display: none;

    .msg.info {

          `).join("");
          panel.innerHTML = `
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>仓库 / 厂库</th>
                    <th>昨日仓单</th>
                    <th>注册量</th>
                    <th>注销量</th>
                    <th>今日仓单</th>
                    <th>净变化</th>
                  </tr>
                </thead>
                <tbody>${rows}</tbody>
              </table>
            </div>
          `;
        }
        panelsEl.appendChild(panel);
      });
    }

    async function refreshData() {
      const btn = document.getElementById("refresh-btn");
      btn.disabled = true;
      btn.classList.add("spinning");
      hideMsg();

      // 本地 file:// 协议下无法 fetch，直接提示
      if (location.protocol === "file:") {
        showMsg("当前是本地双击打开，无法在线刷新。请用「python -m http.server」打开，或部署到 GitHub Pages 后刷新即可获取最新 data.json。", "info");
        btn.disabled = false;
        btn.classList.remove("spinning");
        return;
      }

      try {
        const res = await fetch("data.json?t=" + Date.now(), { cache: "no-store" });
        if (!res.ok) throw new Error("HTTP " + res.status);
        const data = await res.json();
        if (!data.summary) throw new Error("数据格式异常");
        render(data);
        showMsg("已刷新到最新数据（" + data.data_date + "）", "success");
        setTimeout(hideMsg, 3000);
      } catch (e) {
        showMsg("刷新失败：" + e.message + "。已保留当前显示数据。", "error");
      } finally {
        btn.disabled = false;
        btn.classList.remove("spinning");
      }
    }

    // 启动：优先用嵌入数据，保证双击可用
    try {
      render(EMBEDDED_DATA);
      if (location.protocol === "file:") {
        showMsg("本地嵌入数据版本，双击即可查看。点击「刷新数据」在本地无效；部署到网站或用本地服务器后可刷新 data.json。", "info");
      }
    } catch (e) {
      document.getElementById("loading").style.display = "none";
      showMsg("数据加载失败：" + e.message, "error");
    }
  </script>
</body>
</html>
